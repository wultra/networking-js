name: CI
on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn packAll
